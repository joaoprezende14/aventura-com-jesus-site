  /* Carrossel de telas do app — medido no inspecionar da BetterMe (26/08):
     slide de 190px numa janela de 390 = 48,7% do passo (nao os 62% que eu tinha posto),
     e a MOLDURA DO CELULAR vem dentro do PNG deles (817x1641, border-radius 0, sem sombra).
     Aqui a moldura e CSS: assim as telas seguem sendo screenshots limpos 620x1339 — que e
     justamente o que o Davi replica no app. 46% + 12px de gap = os mesmos ~49% de passo.
     Eles usam Splide (biblioteca); aqui e scroll-snap nativo + um passo sozinho a cada 3,2s. */
  .mock{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;margin:2px -16px 0;padding:6px 16px 10px;
    /* sem isto o snap ancora em 16px (o proprio padding) e a 1a tela encosta na borda do painel */
    scroll-padding-inline:16px}
  .mock::-webkit-scrollbar{display:none}
  .mock figure{flex:0 0 min(calc(48.7vw - 12px), 200px);margin:0;scroll-snap-align:start;
    display:flex;justify-content:center}
  /* Moldura medida pixel a pixel no PNG da BetterMe (817x1641): corpo escuro com ARO EXTERNO
     mais claro (rgb 104,104,105 contra 69,69,73 do miolo), bezel de ~3,4% da largura, e TRES
     botoes na esquerda em 19,4% / 26,7% / 36,2% da altura, saltando ~1,1% da largura. Sao os
     botoes que fazem ler como celular: sem eles, e um cartao com um risco em cima. */
  /* a moldura agora vem DENTRO do PNG (metal, botoes, ilha, reflexo de vidro e sombra
     propria), que e como a BetterMe faz. O CSS achatava: gradiente nao e material. */
  .mock img{display:block;width:100%;height:auto;aspect-ratio:398/803;
    -webkit-user-drag:none;user-drag:none;user-select:none;-webkit-user-select:none}
  /* mao de "arrastavel" so onde existe ponteiro de verdade — no celular nao faz sentido */
  @media(hover:hover) and (pointer:fine){ .mock{cursor:grab} }
  .mock figcaption{display:none}
  .mockdots{display:flex;justify-content:center;gap:6px;margin:9px 0 2px}
  .mockdots i{width:6px;height:6px;border-radius:50%;background:rgba(35,76,94,.22);transition:all .2s}
  .mockdots i.on{width:18px;border-radius:3px;background:var(--gold)}
  @media(prefers-reduced-motion:reduce){.mock{scroll-behavior:auto}}
  /* "O que ja esta separado" — item com icone proprio, afirmacao e qualificador (modelo BetterMe) */

  .feat{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid rgba(35,76,94,.10)}
  .feat:last-child{border-bottom:0;padding-bottom:2px}

  /* ---- paywall (estilo onboarding.theopray) ---- */
  .trial{margin:10px 0 4px}
  .plan-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:8px;background:#fff;position:relative}
  .plan-row b{font-size:16px;color:var(--ink)}

  .plan-row .badge{position:absolute;top:-11px;left:14px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.3px}

  /* Card escolhido no molde do print: faixa dourada COLADA no topo do card, largura
     inteira, e o card claro embaixo — a faixa e o card são uma peça só. (Tentei inverter
     o card pra escuro antes; o dono cortou: "o contraste ficou horrível".) */
  .plan-row.sel{border:3px solid var(--gold);background:linear-gradient(160deg,#fffdf6,#fdf4e0);
    padding-top:40px;overflow:hidden;box-shadow:0 8px 22px rgba(191,148,63,.20)}

  .plan-row{gap:12px;border-radius:18px;align-items:center}
  .plan-row .pl-esq{flex:1;min-width:0}
  /* nome em UMA linha nos dois planos: "Plano de 12 meses" quebrando em duas desalinhava
     os cards e empurrava o total pra fora do eixo do vizinho. */
  .plan-row .pl-esq b{display:block;font-size:18.5px;font-weight:700;line-height:1.2;letter-spacing:-.45px;color:var(--ink);white-space:nowrap}
  .pl-tags{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px}
  /* HIERARQUIA: "5 MESES GRÁTIS" é o argumento que paga os R$ 299 — é ele que tem que
     saltar, não o "7 dias grátis" (que é comum aos dois planos e só tira o medo).
     Antes era o contrário: bege apagado no que mais vende, verde sólido no que empata. */
  .pl-tag{display:inline-block;padding:5px 11px;border-radius:8px;

  .pl-free{display:inline-block;padding:3px 8px;border-radius:6px;background:transparent;

  /* o print não tem parágrafo dentro do card — o que "hoje é R$ 0,00" já está na legenda
     do botão. O <small> continua no DOM (vazio) porque pintaOferta() escreve nele quando a
     escada de oferta roda; some sozinho enquanto estiver vazio. */
  .plan-row .pl-esq small{margin-top:5px;font-size:11.5px;line-height:1.35;color:var(--ink-soft)}
  .plan-row .pl-esq small:empty{display:none}
  .pl-dir{text-align:right;flex:0 0 auto;line-height:1.05}
  .pl-diaold{display:block;font-size:14px;color:#b8877f;font-weight:500;text-decoration-thickness:1.5px}

  .plan-row.sel .pl-dia{color:#8a6a22}

  /* selo ocupa a largura do card, igual ao print, em vez de etiqueta no canto */
  /* selo = faixa larga sobre o card (molde do print), não etiqueta de canto */
  .plan-row .badge{left:50%;transform:translateX(-50%);white-space:nowrap;
    min-width:62%;text-align:center;padding:3px 16px;font-size:11.5px;letter-spacing:.6px;
    box-shadow:0 2px 6px rgba(191,148,63,.28)}
  .plan-row{padding:17px 16px}

  @media (max-width:360px){ .pl-dia{font-size:26px} .plan-row .pl-esq b{font-size:16.5px} .pl-tot{font-size:12.5px} .plan-row{padding:14px 12px;gap:8px} }
  .plan-row.sel .radio{background:var(--gold);border-color:var(--gold)}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;font-size:14.5px;color:var(--ink)}
  .switch{width:46px;height:26px;border-radius:99px;background:#c6dde4;position:relative;transition:.2s;flex:none;cursor:pointer}
  .switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on{background:var(--teal-btn)}
  .switch.on:after{left:23px}
  .pw-price{text-align:center;font-size:13.5px;font-weight:700;color:var(--ink);margin:14px 0 2px}
  /* o olho batia no "Anual — R$ 299,00", grande e negrito, e o mensal ficava cinza no texto
     pequeno. ⚠️ Precisa vir DEPOIS de .plan-row b e .pw-price e com especificidade maior:
     .plan-row b é (0,1,1) e ganhava de um .pr-verde solto. */
  /* ⚠️ precisa do font-size: .pr-verde é um <b>, e .plan-row b vale 16px — sem isto o valor
     saía maior que a linha inteira e roubava a leitura em vez de guiá-la. */
  .plan-row .pr-verde, .pw-price .pr-verde, b.pr-verde{color:#2f8f5b;font-weight:800;font-size:13.5px}
  /* garantia: selo à esquerda, promessa à direita */
  /* selo EM CIMA e tudo centralizado — é assim que a BetterMe monta. De lado, o selo virava
     ícone de apoio; em cima, ele é o que a pessoa vê primeiro e o texto vira a explicação. */
  .gar{text-align:center;background:linear-gradient(180deg,#fffdf6,#fff);
    border:1px solid rgba(227,164,78,.42);border-radius:16px;padding:20px 18px 16px;margin:16px 0 4px;

  .gar h3{margin:0 0 8px;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.2px;text-wrap:balance}
  .gar p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-soft);text-wrap:pretty}
  /* o "saiba mais" é letra miúda de propósito: cumpre a parte legal e passa a sensação de
     que nada está escondido, sem competir com a promessa logo acima */
  .gar-pol{display:inline-block;margin-top:10px;font-size:10.5px;line-height:1.4;
    color:var(--ink-soft);text-decoration:underline;opacity:.65}
  .pw-cancel{text-align:center;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  .pw-terms{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:8px 0;line-height:1.5}
  .pw-terms a{color:var(--teal-btn);text-decoration:underline}
  /* CTA pulsante — usado no botao que sobe pra cima da dobra */
  @keyframes ctaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.028)}}

/* render do slot: <img>/Lottie real se a arte existe; senão placeholder. */
const PH = (tag, desc, cls='', style='') => {
  const st = style ? ` style="${style}"` : '';

  if(a && a.lottie) return `<div class="art lottie ${cls}" data-img="${tag}" data-lottie="${a.lottie}"${st}></div>`;
  if(a){

    if(/^APP_/.test(tag)) return `<img class="art ${cls}" data-img="${tag}" src="${a}" alt=""${st} decoding="async" width="620" height="1339">`;

    return `<img class="art ${cls}" data-img="${tag}" src="${a}" alt=""${st}${attr}>`;

/* lottie-web (~250KB) carrega SÓ quando aparece a 1a tela com Lottie (streak/paywall),

let _lottieLoading = false;
function mountLotties(){
  const els = [...document.querySelectorAll('.lottie[data-lottie]:not([data-mounted])')];
  if(!els.length) return;
  if(typeof lottie === 'undefined'){
    if(!_lottieLoading){
      _lottieLoading = true;
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js';
      sc.onload = ()=>{ _lottieLoading = false; mountLotties(); };
      document.head.appendChild(sc);
    }
    return;
  }
  els.forEach(el=>{
    el.dataset.mounted = '1';
    try{
      // hero do paywall: ratio 7:1 (1920×270). Sem 'slice', sobra muito espaço vertical.
      const slice = el.classList.contains('hero') ? { preserveAspectRatio: 'xMidYMid slice' } : {};

  });

       vendas A=3 × B=12 (amostra pequena e janelas mistas — registrado; a chamada é dele,

       visão de fé. ?fl=a segue funcionando SÓ pra QA (não gruda no aparelho).
       O fluxo C (molde BetterMe, dissecação pronta) desafia o B quando o dono pedir. */
    /* 3ª RODADA PAUSADA 03/09/2026, decisão do dono: o C rodou 02-03/09 com passagem
       EMPATADA com o B (16,2% × 16,0% no paywall) mas o dono quer um C mais LONGO de

       atribuição consertada) pra 4ª rodada. ?fl=a|b|c pra QA. */

  }catch(e){ window._acjFluxo = 'B'; }

/* MARCO = o número com que a etapa aparece no BI. No fluxo A é o próprio índice (é assim
   que o histórico inteiro foi gravado); no B, as telas compartilhadas herdam o marco do A
   pela CHAVE e as novas usam o marco próprio. Sem isso, tirar 4 telas do B deslocaria
   paywall/checkout/completo e os dois braços virariam números incomparáveis. */
const MARCO = {};
STEPS_A.forEach((s, n) => { MARCO[s.key] = n; });
function marcoDe(n){
  const s = STEPS[n];
  if(!s) return n;
  if(typeof s.marco === 'number') return s.marco;
  return (MARCO[s.key] !== undefined) ? MARCO[s.key] : n;
}

let i = 0;
const answers = {};
const app = document.getElementById('app');
const main = document.getElementById('main');
const footer = document.getElementById('footer');
const progress = document.getElementById('progress');

function setProgress(){
  progress.innerHTML = '';
  // idade/welcome e fase de cadastro sem barra (igual ao real). Limite por CHAVE, não pelo
  // índice 22: no braço B do teste de fluxo a prepaywall não cai mais no 23, e a barra
  // apareceria em cima do paywall.
  const _iPre = STEPS.findIndex(s => s.key === 'prepaywallScreen');
  if(i < 2 || (_iPre >= 0 && i >= _iPre)){ progress.style.display='none'; return; }
  progress.style.display = 'flex';
  const back = document.createElement('button'); back.className='backbtn'; back.textContent='‹'; back.onclick=()=>go(i-1);
  progress.appendChild(back);
  /* FLUXO C: barra de CAPÍTULOS (molde BetterMe). 5 segmentos com o nome do capítulo —
     a mãe nunca vê "etapa 31 de 46"; vê "capítulo 4 quase cheio". */
  if(window._acjFluxo === 'C' && typeof CAPITULOS_C !== 'undefined'){
    let cap = 0, ini = 2;
    for(let c = 0; c < CAPITULOS_C.length; c++){
      const fim = STEPS.findIndex(x => x.key === CAPITULOS_C[c].ate);
      if(i <= fim){ cap = c; break; }
      ini = fim + 1; cap = c + 1;
    }
    cap = Math.min(cap, CAPITULOS_C.length - 1);
    const fimCap = STEPS.findIndex(x => x.key === CAPITULOS_C[cap].ate);
    const frac = Math.max(0, Math.min(1, (i - ini + 1) / Math.max(1, fimCap - ini + 1)));
    const wrap = document.createElement('div'); wrap.className = 'capwrap';
    let nomeCap = CAPITULOS_C[cap].nome;
    if(/^Menina/i.test(String(answers.childGenderScreen||''))) nomeCap = nomeCap.replace('dele','dela').replace('pra ele','pra ela');
    wrap.innerHTML = `<div class="capname">${nomeCap} · ${cap+1} de 5</div>`
      + `<div class="capbar">` + CAPITULOS_C.map((_, k) =>
          `<i class="${k < cap ? 'full' : ''}">${k === cap ? `<b style="width:${(frac*100).toFixed(0)}%"></b>` : ''}</i>`).join('') + `</div>`;
    progress.appendChild(wrap);
    return;
  }
  const N = 5;
  const lit = (i/(STEPS.length-1)) * (N-1);
  for(let k=0;k<N;k++){
    const c = document.createElement('img'); c.className='pc';
    c.src = (k <= Math.round(lit)) ? 'https://aventuracomjesus.com/img/PROGRESS_CANDLE_ON.webp' : 'https://aventuracomjesus.com/img/PROGRESS_CANDLE_OFF.webp';
    progress.appendChild(c);
    if(k < N-1){
      const ln = document.createElement('div'); ln.className='pl';
      const fi = document.createElement('i'); fi.style.width = (Math.max(0,Math.min(1, lit-k))*100)+'%';
      ln.appendChild(fi); progress.appendChild(ln);
    }
  }
}

// e-mail saiu do quiz e foi pro checkout (24/08). A tela continua no STEPS pra NAO deslocar
// os indices — todo o BI e os testes A/B sao por indice (26 reviews, 27 paywall, 28 cartao, 31 trial).
// Aqui ela e pulada: o marco 22 continua disparando (agora = "passou do ponto onde era o e-mail").
function go(n){
  n = Math.max(0, Math.min(STEPS.length-1, n));
  if (STEPS[n] && STEPS[n].key === 'freeTrialScreen' && !(answers && answers.freeTrialScreen)) {
    var _dir = (n < i) ? -1 : 1;               // respeita o botao VOLTAR: pula pro mesmo lado que ela ia
    var _alvo = n + _dir;
    if (_alvo >= 0 && _alvo <= STEPS.length - 1) {
      i = n; trackStep(marcoDe(n));            // marco 22 do funil preservado
      return go(_alvo);                        // segue sem renderizar
    }
  }
  i = n; render();
  trackStep(marcoDe(i));                       // MARCO, não índice: no braço B do teste de fluxo os índices andam
}

/* FILA DE EVENTOS — o que o servidor não aceitar agora, volta depois.
   Nasceu do apagão de 27/08: a cota do Redis estourou e TODO beacon de celular virou 500,
   ou seja, contagem perdida pra sempre (evento não fica esperando em lugar nenhum). Agora
   o que falha vai pro localStorage e é reenviado na próxima visita ou no próximo passo.
   Reenviar é seguro: o servidor deduplica por (sid, step), então repetido não conta duas vezes. */
const _FILA = 'acj_fila_trk', _FILA_MAX = 300;
function _lerFila(){ try{ return JSON.parse(localStorage.getItem(_FILA) || '[]'); }catch(_){ return []; } }
function _gravarFila(f){ try{ localStorage.setItem(_FILA, JSON.stringify(f.slice(-_FILA_MAX))); }catch(_){} }
function _guarda(body){ const f=_lerFila(); f.push(body); _gravarFila(f); }

function enviaOuGuarda(body){
  // sendBeacon não conta status: se ele aceitar, a gente não sabe se o servidor recusou.
  // Por isso o caminho normal é fetch (dá pra ler o 503) e o beacon fica só pra saída da página.
  try{
    fetch('/api/track', { method:'POST', headers:{'Content-Type':'text/plain'}, body, keepalive:true })
      .then(function(r){ if(!r.ok && r.status >= 500) _guarda(body); })
      .catch(function(){ _guarda(body); });
  }catch(_){
    try{ if(navigator.sendBeacon) navigator.sendBeacon('/api/track', body); else _guarda(body); }catch(__){ _guarda(body); }
  }
}

/* esvazia a fila: um por vez, parando no primeiro que falhar (não adianta martelar
   um servidor que já disse que não pode) */
function _esvaziaFila(){
  const f = _lerFila();
  if(!f.length) return;
  const item = f[0];
  fetch('/api/track', { method:'POST', headers:{'Content-Type':'text/plain'}, body:item })
    .then(function(r){
      if(r.ok || r.status < 500){ const g=_lerFila(); g.shift(); _gravarFila(g); setTimeout(_esvaziaFila, 350); }
    })
    .catch(function(){});
}

function bnFloodFill(ctx,x,y,fill){
  const w=ctx.canvas.width,h=ctx.canvas.height;
  if(x<0||y<0||x>=w||y>=h) return false;
  const img=ctx.getImageData(0,0,w,h), d=img.data, at=(px,py)=>(py*w+px)*4;
  const s=at(x,y), sr=d[s],sg=d[s+1],sb=d[s+2];
  if(sr+sg+sb<180) return false;                                             // barreira = linha escura, não pinta
  if(Math.abs(sr-fill[0])<8&&Math.abs(sg-fill[1])<8&&Math.abs(sb-fill[2])<8) return false;
  const tol=60, ok=(i)=> (d[i]+d[i+1]+d[i+2]>=180) && Math.abs(d[i]-sr)<=tol && Math.abs(d[i+1]-sg)<=tol && Math.abs(d[i+2]-sb)<=tol;
  const st=[x,y];
  while(st.length){
    const cy=st.pop(), cx=st.pop();
    if(cx<0||cy<0||cx>=w||cy>=h) continue;
    const i=at(cx,cy); if(!ok(i)) continue;
    d[i]=fill[0]; d[i+1]=fill[1]; d[i+2]=fill[2]; d[i+3]=255;
    st.push(cx+1,cy, cx-1,cy, cx,cy+1, cx,cy-1);
  }
  ctx.putImageData(img,0,0); return true;
}
/* Som do pincel. Sintetizado no Web Audio, sem NENHUM arquivo: zero KB, zero requisição,
   e não precisa afrouxar o CSP pra carregar mp3 de fora. O "plop" é uma senoide que sobe
   de ~430 pra ~690 Hz em 90ms com filtro passa-baixa — lê como tinta caindo, não como bipe. */
let _bnAc=null, _bnMudo=false;
try{ _bnMudo = localStorage.getItem('acj_bn_mudo')==='1'; }catch(_){}
function bnAudio(){
  if(_bnMudo) return null;
  try{
    if(!_bnAc) _bnAc = new (window.AudioContext||window.webkitAudioContext)();
    if(_bnAc.state==='suspended') _bnAc.resume();
    return _bnAc;
  }catch(_){ return null; }
}
function bnPlop(){
  const ac=bnAudio(); if(!ac) return;
  const t=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(430+Math.random()*70, t);
  o.frequency.exponentialRampToValueAtTime(690+Math.random()*90, t+0.09);
  f.type='lowpass'; f.frequency.value=2400;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.15, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.20);
  o.connect(f); f.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+0.22);
}
function bnFanfarra(){
  const ac=bnAudio(); if(!ac) return;
  // arpejo maior (dó–mi–sol–dó): resolve pra cima, que é o que soa como "conseguiu"
  [523.25, 659.25, 783.99, 1046.5].forEach(function(hz,k){
    const t=ac.currentTime+k*0.11;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(hz,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.13, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.42);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+0.44);
  });
}
function wireColoringDemo(){
  const cv=document.getElementById('bnCanvas'); if(!cv||cv._wired) return; cv._wired=true;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  let sel=bnHexToRgb(BN_COLORS[0]), snaps=[], painted=false, ready=false, lastTouch=0;
  let brancoInicial=0, pinturas=0, comemorou=false, sumir=null;
  const win=document.getElementById('bnWin');
  const im=new Image();
  // quanto ainda sobrou de branco por pintar — é assim que dá pra saber que a criança
  // "terminou" sem precisar mapear região por região da arte. Amostra 1 pixel a cada 8.
  function branco(){
    const d=ctx.getImageData(0,0,cv.width,cv.height).data; let n=0;
    for(let i=0;i<d.length;i+=32){ if(d[i]>235&&d[i+1]>235&&d[i+2]>235) n++; }
    return n;
  }
  function esconde(){ if(win){ win.classList.remove('on'); win.setAttribute('aria-hidden','true'); } }
  function comemora(){
    if(comemorou||!win) return; comemorou=true;
    win.classList.add('on'); win.setAttribute('aria-hidden','false');
    bnFanfarra();
    clearTimeout(sumir); sumir=setTimeout(esconde, 4600);   // some sozinho: a criança pode querer continuar
  }
  im.onload=()=>{
    cv.width=im.naturalWidth||700; cv.height=im.naturalHeight||700;
    ctx.drawImage(im,0,0,cv.width,cv.height); ready=true;
    try{ brancoInicial=branco(); }catch(_){ brancoInicial=0; }
  };
  im.onerror=()=>{ const p=cv.closest('.bn-panel'); if(p) p.style.display='none'; };   // arte faltou = esconde o bloco (não quebra a PV)
  im.src='https://aventuracomjesus.com/img/colorir-demo-arte-davi.png?v=4';   // v= muda quando a arte muda, senão o cache segura a antiga
  const pal=document.getElementById('bnPalette');
  if(pal) pal.addEventListener('click',(e)=>{ const b=e.target.closest('.bn-sw'); if(!b) return; pal.querySelectorAll('.bn-sw').forEach(x=>x.classList.remove('on')); b.classList.add('on'); sel=bnHexToRgb(b.dataset.c); });
  function paintAt(cx,cy){
    if(!ready) return;
    const r=cv.getBoundingClientRect();
    const x=Math.floor((cx-r.left)*cv.width/r.width), y=Math.floor((cy-r.top)*cv.height/r.height);
    snaps.push(ctx.getImageData(0,0,cv.width,cv.height)); if(snaps.length>12) snaps.shift();
    const done=bnFloodFill(ctx,x,y,sel);
    if(!done) return;
    bnPlop(); pinturas++;
    if(!painted){ painted=true; try{ trackStep(50); }catch(_){} }   // evento "pintou ≥1 área" = step sintético 50
    // completou = sobrou pouco branco. O 2º critério garante que a comemoração acontece
    // mesmo numa arte com muita área de fundo, senão ninguém veria o versículo.
    // ⚠️ O critério de branco precisa de um PISO de toques. Na arte de traço premium as
    // regiões são poucas e enormes (sol, túnica, lã): 4 toques já passavam de 58% de área
    // pintada e a comemoração caía em cima de um desenho quase vazio — parecia bug, não
    // recompensa. Com piso de 5, ela só entra quando a mãe já se envolveu de verdade.
    if(!comemorou && (pinturas>=8 || (pinturas>=5 && brancoInicial>0 && branco() < brancoInicial*0.34))) comemora();
  }
  cv.addEventListener('click',(e)=>{ if(Date.now()-lastTouch<600) return; paintAt(e.clientX,e.clientY); });
  cv.addEventListener('touchend',(e)=>{ if(e.changedTouches&&e.changedTouches[0]){ e.preventDefault(); lastTouch=Date.now(); paintAt(e.changedTouches[0].clientX,e.changedTouches[0].clientY); } },{passive:false});
  if(win) win.addEventListener('click', esconde);
  const u=document.getElementById('bnUndo'); if(u) u.addEventListener('click',()=>{ const s=snaps.pop(); if(s){ ctx.putImageData(s,0,0); if(pinturas>0) pinturas--; } });
  const c=document.getElementById('bnClear'); if(c) c.addEventListener('click',()=>{ if(ready){ ctx.drawImage(im,0,0,cv.width,cv.height); snaps=[]; pinturas=0; comemorou=false; esconde(); } });
  const so=document.getElementById('bnSom');
  if(so){
    const pinta=()=>{ so.innerHTML=ico(_bnMudo?'mudo':'som'); so.setAttribute('aria-label', _bnMudo?'Ligar som':'Desligar som'); };
    pinta();
    so.addEventListener('click',()=>{ _bnMudo=!_bnMudo; try{ localStorage.setItem('acj_bn_mudo', _bnMudo?'1':'0'); }catch(_){} pinta(); if(!_bnMudo) bnPlop(); });
  }
}

/* Depois que ela respondeu menino/menina (etapa 2), o quiz PARA de falar "a criança" e
   "seu pequeno" e passa a falar do filho DELA, no gênero certo. Pedido do dono, e é o mesmo
   princípio da prova social da etapa 1: cada resposta dada deixa a página mais dela.
   ⚠️ O que NUNCA passa por aqui:
     - options (viram chave no perfil de público do BI — personalizar fragmentaria o dado);
     - verse/quote/sign (Escritura e depoimento de outra mãe não mudam de gênero);
     - plurais genéricos ("pais e filhos no mundo todo").
   As trocas são de FRASE, não de palavra: "pelo seu filho"→"pela sua filha",
   "faça-o dormir"→"faça-a dormir" — concordância junto, senão sai "o sua filha". */
function generifica(txt){
  if(typeof txt !== 'string' || !txt) return txt;
  const g = String((answers && answers.childGenderScreen) || '');
  if(!/^Menin/i.test(g)) return txt;
  const T = /^Menina/i.test(g) ? [
    ['pelo seu filho','pela sua filha'], ['do seu filho','da sua filha'], ['ao seu filho','à sua filha'],
    ['para o seu filho','para a sua filha'],
    // 'pro seu filho' precisa de par PRÓPRIO: sem ele o par genérico deixava "pro sua filha"
    ['pro seu filho','pra sua filha'], ['pro meu filho','pra minha filha'],
    ['o seu filho','a sua filha'], ['seu filho','sua filha'],
    ['do seu pequeno','da sua filha'], ['seu pequeno','sua filha'],
    // adjetivo solto depois do sujeito: sem este par a pergunta da urgência saía
    // "na vida da sua filha ... enquanto ELE ainda é NOVO" (pego no QA em 04/09)
    ['ele ainda é novo','ela ainda é nova'],
    ['da criança','da sua filha'], ['a criança','a sua filha'],
    ['faça-o dormir','faça-a dormir'],
    /* pares das OPÇÕES (04/09) — antes elas nunca flexionavam e a menina lia "quero ver ELE
       no caminho de Deus". São frases inteiras de propósito: par solto em 'ele' quebraria
       'eles', 'aquele' e 'dele' no quiz inteiro. */
    ['a fase dele','a fase dela'], ['passar isso pra ele','passar isso pra ela'],
    ['a atenção dele','a atenção dela'], ['na vida dele','na vida dela'],
    ['Que ele cresça','Que ela cresça'], ['Que ele não desenvolva','Que ela não desenvolva'],
    ['enquanto ele é pequeno','enquanto ela é pequena'],
    ['quero ver ele','quero ver ela'], ['ver ele próximo','ver ela próxima'],
    /* achados da auditoria de 04/09 — o que ainda saía no masculino pra mãe de menina */
    ['mais próximo de Deus','mais próxima de Deus'], ['Meu filho','Minha filha'],
    ['Ele não demonstra','Ela não demonstra'], ['pedindo pra orar sozinho','pedindo pra orar sozinha'],
    ['veja seu filho','veja sua filha'], ['idade do seu filho','idade da sua filha'],
    ['meu filho','minha filha'], ['desde pequeno','desde pequena'],
  ] : [
    ['do seu pequeno','do seu filho'], ['seu pequeno','seu filho'],
    ['da criança','do seu filho'], ['a criança','o seu filho'],
  ];
  for(const par of T) txt = txt.split(par[0]).join(par[1]);
  return txt;
}
const GEN_CAMPOS = ['title','sub','msg','body','d','subA','subB','lbl','label','heroStepLabel'];   // verse/quote/sign FORA

function render(){
  const s0 = STEPS[i];
  // cópia rasa com os textos no gênero certo — o STEPS original nunca é mutado (a mesma
  // sessão pode voltar e trocar a resposta de menino pra menina)
  let s = s0;
  if(answers && answers.childGenderScreen){
    s = { ...s0 };
    for(const c of GEN_CAMPOS) if(typeof s[c] === 'string') s[c] = generifica(s[c]);
    // a prepaywall guarda o texto num ARRAY (lines) — "Estamos personalizando o caminho do seu filho"
    if(Array.isArray(s.lines)) s.lines = s.lines.map(generifica);
    /* OPÇÕES flexionam só o que APARECE. O valor gravado em answers continua sendo o texto
       original (_orig) — senão o Perfil de Público do BI rachava cada resposta em duas linhas
       (uma "pro meu filho", outra "pra minha filha") e a pesquisa virava sopa. */
    if(Array.isArray(s.options)) s.options = s.options.map(function(o){
      return { ...o, _orig: o.txt, txt: generifica(o.txt), note: o.note ? generifica(o.note) : o.note };
    });
  }
  app.classList.toggle('warm', !!s.warm);
  app.classList.toggle('full', !!s.full);
  app.classList.toggle('proof', s.type==='proof');   // 2a etapa: CTA inline, sem footer fixo -> nao reservar os 130px
  setProgress();
  main.innerHTML = ''; footer.innerHTML = ''; main.scrollTop = 0; app.classList.remove('herob');
  (TYPES[s.type] || (()=>{}))(s);
  fbTrack(s);
  mountLotties();
}

// o contador de 7 min so comeca quando a barra de urgencia aparece na tela
function startUrgencyWhenVisible(){
  try{
    var el = document.querySelector('.urgency');
    if(!el || _offerDeadline) return;
    if(!('IntersectionObserver' in window)){ _offerDeadline = Date.now() + 7*60*1000; return; }
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting && !_offerDeadline){ _offerDeadline = Date.now() + 7*60*1000; obs.disconnect(); }
      });
    }, { threshold: 0.35 });
    obs.observe(el);
  }catch(e){ if(!_offerDeadline) _offerDeadline = Date.now() + 7*60*1000; }
}

  if(!alvo) return;
  var t0 = Date.now(), pronto = false, iv = null;
  function revelar(motivo){
    if(pronto) return; pronto = true;
    if(iv) clearInterval(iv);
    alvo.classList.remove('pw-hide'); alvo.classList.add('pw-show');
    startUrgencyWhenVisible();                 // so agora a barra de urgencia existe na tela
    if(motivo === 'pitch'){ try{ trackStep(52); }catch(e){} }
  }
  iv = setInterval(function(){
    try{
      var el = document.querySelector('vturb-smartplayer');
      var t = (el && typeof el.currentTime === 'number' && isFinite(el.currentTime)) ? el.currentTime : 0;
      if(t >= VSL_PITCH_S) return revelar('pitch');
      // rede de seguranca: se o player nao subir em 40s, abre a pagina — nunca deixar lead numa tela morta
      var subiu = !!(window.smartplayer && smartplayer.instances && smartplayer.instances.length);
      if(!subiu && Date.now() - t0 > 40000) return revelar('falha');
    }catch(e){ if(Date.now() - t0 > 40000) revelar('erro'); }
  }, 500);
}

  return false;
  // eslint-disable-next-line no-unreachable
  const et = window.__brEtapa || 0;
  if(et >= BR_MODAIS.length) return false;                 // já mostrou os dois: deixa sair
  if(document.querySelector('.brmask')) return false;      // já tem modal na tela
  if(Date.now() < (window.__brLiberaEm || 0)) return false;
  try{
    // no CHECKOUT o modal não pode aparecer (o SetupIntent já nasceu e a oferta não chegaria
    // na Stripe). Nos gatilhos novos, exige estar no paywall — se ela voltou pro quiz, é cedo.
    if(STEPS[i] && STEPS[i].key === 'checkoutScreen') return false;
    if(exigePaywall && !(STEPS[i] && STEPS[i].key === 'paywallScreen')) return false;
  }catch(_){}
  // ⚠️ Gatilho MOLE (rolagem, volta de app) nunca abre o 2º modal. O 2º dá 30 dias grátis
  // + metade do 1º mês; entregar isso por dois palpites seguidos é dar a oferta cara pra quem
  // nunca tentou sair. O TRIAL30 fica reservado a quem apertou VOLTAR de verdade.
  if(et > 0 && (marcoGatilho === 58 || marcoGatilho === 59)) return false;
  window.__brEtapa = et + 1;
  try{ sessionStorage.setItem('acj_br_etapa', String(et + 1)); }catch(_){}   // sobrevive a recarga (celular)
  window.__brLiberaEm = Date.now() + BR_COOLDOWN;
  if(marcoGatilho){ try{ trackStep(marcoGatilho); }catch(_){} }
  abreModalBack(BR_MODAIS[et]);
  return true;
}

/* Ela já passou pelo seletor de planos? É o divisor entre "está saindo" e "ainda está lendo".
   Antes de ver preço, nenhum gesto dela significa recusa da oferta. */
function viuAOferta(rolador){
  try{
    // ⚠️ ignora o bloco do TOPO (braço sem vídeo): ele está visível desde o 1º pixel, e
    // contá-lo faria "já viu a oferta" nascer verdadeiro — o modal de saída por rolagem
    // dispararia em quem mal abriu a página.
    const plano = document.querySelector('.trial:not(.trial-topo) .plan-row') || document.querySelector('.plan-row');
    if(!plano) return false;
    const topoPlano = plano.getBoundingClientRect().top + rolador.scrollTop
                    - rolador.getBoundingClientRect().top;
    return (window.__brFundo || 0) >= topoPlano - rolador.clientHeight * 0.5;
  }catch(_){ return (window.__brFundo || 0) > (rolador.clientHeight || 600) * 4; }
}

function armaBackRedirect(){
  /* Com o checkout na HOTMART e sem as ofertas de back criadas la, os modais ficam MUDOS:
     eles prometem METADE50/30 dias, que sao mecanica da STRIPE (cupom + trial por parametro)
     — a Hotmart cobraria cheio e a promessa viraria mentira no valor. Quando back1/back2
     existirem no HOTMART_OFERTAS, este guard deixa de agir e os modais voltam sozinhos
     (com os botoes ainda por religar pros links). */
  if(window.vaiPraHotmart && window.vaiPraHotmart() && !((window.HOTMART_OFERTAS||{}).back1)) return;
  if(window.__brArmado) return; window.__brArmado = true;
  /* A etapa da escada sobrevive a RECARGA (sessionStorage): no celular, voltar do checkout
     recarrega a pagina (sem bfcache) e a memoria em window zerava — a escada recomecava do
     1o modal a cada retorno e o 2o (a oferta cara) ficava inalcancavel justo pro publico
     mobile, que e quase todo o trafego. "Uma vez por sessao" agora vale de verdade. */
  var _etSalva = 0; try{ _etSalva = Number(sessionStorage.getItem('acj_br_etapa') || 0) || 0; }catch(_){}
  window.__brEtapa = _etSalva;
  window.__brLiberaEm = Date.now() + BR_ESPERA;
  try{
    history.pushState({acj:'br'}, '', location.href);
    window.addEventListener('popstate', function(){
      // ⚠️ Re-empilha SÓ SE o modal abriu. Antes empilhava primeiro: no checkout, onde o modal
      // é proibido, o voltar era consumido, nada aparecia e ela ficava presa na página por um
      // toque. Botão voltar que não volta é a coisa mais agressiva que dá pra fazer numa página.
      window.__brLiberaEm = 0;   // quem apertou voltar decidiu sair, não está chegando
      const abriu = disparaBack(0, false);
      if(abriu && (window.__brEtapa || 0) < BR_MODAIS.length){
        try{ history.pushState({acj:'br'}, '', location.href); }catch(_){}
      }
    });
  }catch(e){}

  // ── ROLAGEM PRA CIMA: desceu a página e voltou correndo pro topo ──────────
  // ⚠️ Duas armadilhas que quase mataram este gatilho, as duas pegas testando no navegador:
  //   1. QUEM ROLA NÃO É A JANELA. O #main tem overflow-y:auto, então window.scrollY nunca
  //      muda. E scroll de ELEMENTO não chega no document — nem borbulhando, nem na captura
  //      (conferido no navegador: zero eventos). Tem que escutar no #main direto; o window
  //      fica junto só como rede, pro caso de a rolagem um dia voltar pra página.
  //   2. ROLAGEM POR INÉRCIA anda ~40px por evento. Exigir 120px num evento só nunca ia
  //      disparar. Então ACUMULA a subida enquanto o gesto continua pra cima e zera quando
  //      ela desce de novo.
  try{
    let ultY = null, ultT = 0, fundo = 0, subiu = 0, subiuDesde = 0;
    const aoRolar = function(){
      const el = (this && this !== window) ? this : null;
      const y = el ? el.scrollTop : (window.scrollY || 0);
      const alt = (el ? el.clientHeight : innerHeight) || innerHeight;
      const t = Date.now();
      if(ultY === null){ ultY = y; ultT = t; return; }
      const d = ultY - y;                                  // positivo = subindo
      if(y > fundo) fundo = y;
      window.__brFundo = fundo;                            // viuAOferta() lê daqui
      if(d > 0){
        if(!subiu || t - ultT > 400){ subiu = 0; subiuDesde = t; }   // recomeça a contar
        subiu += d;
      } else if(d < -6){
        subiu = 0;                                        // voltou a descer: não está saindo
      }
      ultY = y; ultT = t;
      if(subiu > BR_SUBIDA && (t - subiuDesde) < BR_JANELA
         && y < BR_TOPO                                   // PAROU no topo, não passou por ele
         && el && viuAOferta(el)){                        // e já tinha visto o preço
        subiu = 0;
        disparaBack(58, true);
      }
    };
    const rolador = document.getElementById('main');
    if(rolador) rolador.addEventListener('scroll', aoRolar, { passive: true });
    window.addEventListener('scroll', aoRolar, { passive: true });
  }catch(e){}

  // ── VOLTOU DE OUTRO APP: saiu do navegador e voltou ───────────────────────
  try{
    let saiuEm = 0;
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ saiuEm = Date.now(); return; }
      // Régua: menos de 20s é notificação/tela apagando; mais de 5min ela não "voltou", ela
      // recomeçou. E só conta se já tinha visto o preço — senão é interrupção, não resgate.
      const fora = saiuEm ? Date.now() - saiuEm : 0;
      const rol = document.getElementById('main');
      if(fora > 20000 && fora < 300000 && rol && viuAOferta(rol)) disparaBack(59, true);
      saiuEm = 0;
    });
  }catch(e){}

  // ── MOUSE SAINDO PELO TOPO: só desktop ───────────────────────────────────
  // ⚠️ Só liga em aparelho SEM toque. Android sintetiza evento de mouse depois do toque, e um
  // toque perto do topo podia virar "saiu pela barra do navegador" — modal do nada no celular,
  // que é justamente o que o dono pegou. E exige ter visto a oferta, igual aos outros.
  try{
    if(!('ontouchstart' in window) && !navigator.maxTouchPoints){
      document.addEventListener('mouseout', function(ev){
        if(ev.relatedTarget || ev.toElement) return;      // ainda dentro da página
        if((ev.clientY || 0) > 8) return;                 // saiu por baixo/lado, não pra fechar
        const rol = document.getElementById('main');
        if(rol && !viuAOferta(rol)) return;
        disparaBack(57, true);
      });
    }
  }catch(e){}
}
/* Aplica a oferta do back redirect NA TELA e no que vai pro backend.
   Duas ofertas, exclusivas entre si:
     METADE  -> cupom METADE50 (50% off, duration=once) só na 1ª cobrança
     TRIAL30 -> trial de 30 dias em vez de 7 (o webhook valida contra allowlist)
   O paywall PRECISA refletir: prometer no modal e mostrar outra coisa no cartão é o
   jeito mais rápido de perder a venda que a gente acabou de recuperar. */
function aplicaOferta(tipo){
  if(!tipo || window._acjOferta === tipo) return;
  // ⚠️ A 2ª oferta SOMA à 1ª (decisão do dono, 27/08). Antes ela SUBSTITUÍA, e aí quem tinha
  // acabado de ganhar R$ 29,95 via o preço VOLTAR pra R$ 59,90 ao aceitar os 30 dias — a
  // oferta andava pra trás na cabeça dela bem na hora de salvar a venda. TRIAL30 carrega o
  // cupom junto mesmo pra quem recusou o 1º modal: o 2º promete os dois, tem que entregar os dois.
  window._acjOferta = tipo;
  window._acjPromo     = 'METADE50';                                  // vale pros dois modais
  window._acjTrialDias = (tipo==='TRIAL30') ? 30 : undefined;
  // o SetupIntent que já existir foi criado SEM a oferta — obriga a refazer, senão a tela
  // promete 30 dias e a Stripe cobra no 7º
  try{ _subPrefetch = null; }catch(_){}
  try{ sessionStorage.setItem('acj_oferta', tipo); }catch(_){}   // sobrevive ao F5 e ao retorno do 3DS
  try{ pintaOferta(); }catch(_){}
}
// oferta é sobre a MENSALIDADE. No anual ela não viaja — 50% once em R$ 299 são R$ 149,50,
// cinco vezes o que o modal prometeu. O servidor também barra, isto aqui é a 1ª camada.
function ofertaDoPlano(){
  const anual = !!(typeof answers==='object' && answers && answers._planCode==='year');
  return anual
    ? { promo:undefined, trialDias:undefined }
    : { promo:(window._acjPromo||undefined), trialDias:(window._acjTrialDias||undefined) };
}
/* Pinta o paywall com a oferta ACEITA. Lê o estado real (_acjPromo / _acjTrialDias) em vez do
   rótulo da oferta: com o 2º modal somando desconto + tempo existem três combinações, e derivar
   do rótulo já tinha feito a tela prometer uma coisa e o cartão cobrar outra. */
function pintaOferta(){
  if(!window._acjOferta) return;
  const dias = window._acjTrialDias || 7;
  const meia = !!window._acjPromo;
  const vd   = t => `<b class="pr-verde">${t}</b>`;
  const pDias = dias === 30 ? `${vd('30 dias')} 100% grátis` : '7 dias 100% grátis';
  const pMes  = meia ? `1º mês por ${vd('R$ 29,95')}, depois ${TK.mes}/mês`
                     : `depois ${TK.mes}/mês · cancele quando quiser`;
  const nota  = `${pDias} · ${pMes}`;
  const notaTxt = nota.replace(/<[^>]+>/g, '') + '.';   // versão sem tag pro data-note
  const cta = `Resgatar ${dias} dias por R$ 0,00`;
  document.querySelectorAll('.pw-price').forEach(p=> p.innerHTML = nota);
  document.querySelectorAll('.pw-cta').forEach(b=> b.textContent = cta);
  const linhas = document.querySelectorAll('.plan-row[data-plan="trial"]');   // o paywall tem DOIS blocos
  linhas.forEach(function(linha){
    linha.dataset.cta = cta;
    linha.dataset.note = notaTxt;
    const b = linha.querySelector('b'), sm = linha.querySelector('small');
    if(b) b.textContent = `Teste ${dias} dias grátis`;
    if(sm) sm.innerHTML = `R$ 0,00 hoje · ${dias === 30 ? vd('30 dias') + ' grátis · ' : ''}`
                        + (meia ? `1º mês por ${vd('R$ 29,95')}, depois ${TK.mes}/mês`
                                : `depois ${TK.mes}/mês`);
  });
  const linha = linhas[0];
  // selo, pra ela ver que a oferta GRUDOU e não precisar acreditar em promessa
  const txtSelo = (meia && dias === 30) ? '30 dias grátis + 50% na 1ª mensalidade'
                : (dias === 30)         ? '30 dias grátis aplicados'
                                        : 'Desconto de 50% aplicado na 1ª mensalidade';
  const selo = document.querySelector('.oferta-selo');
  if(selo){
    // a 2ª oferta chega COM o selo da 1ª já na tela — sem isto ele congelaria em "50% aplicado"
    const sp = selo.querySelector('span'); if(sp) sp.textContent = txtSelo;
  } else if(linha){
    const novo = document.createElement('div');
    novo.className = 'oferta-selo';
    novo.innerHTML = `${ico('check')}<span>${txtSelo}</span>`;
    linha.parentNode.insertBefore(novo, linha);
  }
}
/* Vocativo vindo da resposta do quiz (relationshipScreen: Mãe · Pai · Avô/Avó · Outro).
   Chamar de "mãe" quem respondeu "Pai" quebra a ilusão de que a página fala com ELA —
   e o back é justamente o momento em que ela precisa sentir que alguém está falando com ela.
   Avô/Avó e Outro não dizem o gênero, então o vocativo sai fora: "Peraí." sozinho continua
   sendo quebra de padrão. Melhor sem tratamento do que com o errado. */
function vocativo(){
  try{
    const r = (answers && answers.relationshipScreen) || '';
    if(/^Mãe/i.test(r)) return ', mãe';
    if(/^Pai/i.test(r)) return ', pai';
  }catch(_){}
  return '';
}
/* O bloco do presente. Duas formas, e a diferença NÃO é enfeite:
   - valor único (1º modal): um presente só, então o preço novo pode ocupar a tela inteira;
   - empilhado (2º modal): dois presentes, e aí o que precisa ficar claro é a SOMA. Preço
     gigante aqui esconderia o ganho de tempo, que é a novidade da segunda oferta. */
function presenteBlock(p){
  const cab = `<span class="brgift-ico">${ico('presente')}</span>`
            + `<span class="brgift-free">${p.chip}</span>`;
  if(!p.linhas){
    return `<div class="brgift">${cab}
      <s class="brgift-de">${p.de}</s>
      <b class="brgift-por">${p.por}</b>
      <span class="brgift-lbl">${p.lbl}</span></div>`;
  }
  const linhas = p.linhas.map(l => `<div class="brg2-linha">
      <span class="brg2-lbl">${l.lbl}</span>
      <span class="brg2-val"><s>${l.de}</s><i class="brg2-seta">${ico('seta')}</i><b>${l.por}</b></span>
    </div>`).join('');
  return `<div class="brgift brgift-duplo">${cab}${linhas}</div>`;
}
function abreModalBack(m){
  // ⚠️ No CHECKOUT o SetupIntent já nasceu (ele é criado quando o e-mail fica válido), e a
  // oferta aceita depois disso NÃO chega na Stripe — a tela prometeria 30 dias e o cartão
  // seria cobrado no 7º. Enquanto o fluxo não recriar o intent, o modal não aparece lá.
  try{ if(STEPS[i] && STEPS[i].key === 'checkoutScreen') return; }catch(_){}
  const antigo = document.querySelector('.brmask'); if(antigo) antigo.remove();
  try{ trackStep(m.marco); }catch(e){}
  const el = document.createElement('div');
  el.className = 'brmask';
  el.innerHTML =
    `<div class="brcard" role="dialog" aria-modal="true" aria-label="${String(m.titulo).replace('{VOC}', vocativo())}">
      <h2>${String(m.titulo).replace('{VOC}', vocativo())}</h2>
      <p>${m.corpo}</p>
      ${m.presente ? presenteBlock(m.presente)
        : `<div class="brbox"><span class="ic">${ico(m.caixaIco||'escudo')}</span><span class="tx">${m.caixaTexto}</span></div>`}
      <button class="brbtn pulsa" type="button">${m.btn}</button>
      <button class="brskip" type="button">${m.sair}</button>
      <p class="brnote">${m.nota}</p>
    </div>`;
  document.body.appendChild(el);
  el.querySelector('.brbtn').onclick = function(){
    // 55 = aceitou a METADE · 56 = aceitou os 30 DIAS. Antes era 55 pras duas, e aí o painel
    // mostrava "120 aceites" sem dizer qual — que é justamente a pergunta que decide se a
    // oferta cara vale a pena.
    try{ trackStep(m.oferta === 'TRIAL30' ? 56 : 55); }catch(_){}
    try{ aplicaOferta(m.oferta); }catch(_){}       // o botão é o aceite da oferta
    el.remove();
    // Aceitar e cair de volta no meio da PV era a maior burrice do fluxo: ela acabou de
    // dizer SIM e tinha que ROLAR pra achar o preço — no meio do caminho reencontra o vídeo,
    // as vantagens, o FAQ, tudo que já venceu. Agora vai direto pro cartão de preço, que o
    // pintaOferta() acabou de reescrever com o que o modal prometeu. Ver a promessa cumprida
    // no preço é o fecho da oferta; sem isso o modal só atrasa a saída.
    try{ levaAoPreco(); }catch(_){}
  };
  el.querySelector('.brskip').onclick = function(){ el.remove(); };
  el.addEventListener('click', function(ev){ if(ev.target === el) el.remove(); });
}

/* Leva ao cartão de preço depois do aceite do back redirect.
   Escolhe o bloco MAIS PRÓXIMO dela (o paywall tem dois: um no meio, outro no fim) em vez de
   sempre o primeiro — jogar quem estava no rodapé lá pra cima é outro jeito de fazer ela
   rolar de novo. block:'center' e não 'start' porque o cartão tem ~3 linhas de preço abaixo
   do topo: alinhar pelo topo deixaria o valor da promessa fora da tela em aparelho baixo. */
function levaAoPreco(){
  const blocos = Array.from(document.querySelectorAll('#main .trial'));
  if(!blocos.length) return;
  const meio = window.innerHeight / 2;
  let alvo = blocos[0], melhor = Infinity;
  for(const b of blocos){
    const d = Math.abs(b.getBoundingClientRect().top + b.offsetHeight / 2 - meio);
    if(d < melhor){ melhor = d; alvo = b; }
  }
  const rola = suave => {
    try{ alvo.scrollIntoView({ behavior: suave ? 'smooth' : 'auto', block:'center' }); }
    catch(_){ alvo.scrollIntoView(); }
  };
  // ⚠️ MEDIDO: o smooth sozinho NÃO anda. pintaOferta() reescreve o DOM e o modal sai no
  // mesmo frame — o navegador cancela a animação e ela fica exatamente onde estava (scrollTop
  // idêntico antes e depois). Os navegadores in-app do Face fazem pior. Então: pede o suave
  // no frame seguinte e, se em 420ms o cartão não estiver na tela de verdade, dá o salto seco.
  // setTimeout e nao requestAnimationFrame: rAF NAO DISPARA com a aba escondida (medido —
  // o scroll simplesmente nao acontecia), e a mae pode voltar pro app com a aba em segundo
  // plano. O timer roda em qualquer estado.
  setTimeout(function(){
    rola(true);
    setTimeout(function(){
      const r = alvo.getBoundingClientRect();
      if(r.top > innerHeight * 0.75 || r.bottom < innerHeight * 0.25) rola(false);
    }, 420);
  }, 0);
  // pisca o cartão: sem isso ela chega no preço sem perceber que ELE MUDOU
  alvo.classList.remove('acende'); void alvo.offsetWidth; alvo.classList.add('acende');
  setTimeout(()=>alvo.classList.remove('acende'), 2600);
}

/* PROFUNDIDADE DE ROLAGEM NO PAYWALL — 29/08.
   Existe pra responder UMA pergunta que nenhum número atual responde: desde 24/08 a VSL
   entra ANTES da oferta e o paywall->checkout caiu de 55% pra 34%. Só que "não foi pro
   checkout" junta duas mães completamente diferentes:
       a que VIU o preço e disse não   -> problema de oferta/preço
       a que NUNCA CHEGOU no preço     -> problema de layout, e o conserto é mover o bloco
   Sem esta medida a decisão de tirar o vídeo de cima é chute. Com ela é conta.

   71 = a mãe teve o BLOCO DE PREÇO na tela (35% dele visível — não vale raspar de leve)
   72 = chegou no FIM da página (2º bloco de preço), ou seja, rolou o paywall inteiro

   Só no paywall: as outras telas não têm .trial. Custo: 2 marcos numa tela que ~13% das
   sessões alcançam — o Redis já estourou a cota uma vez, por isso não são cinco. */
function armaProfundidade(){
  const blocos = main.querySelectorAll('.trial');
  if(!blocos.length) return;
  const alvos = new Map([[blocos[0], 71]]);
  if(blocos.length > 1) alvos.set(blocos[blocos.length - 1], 72);

  // Regra única, usada pelos DOIS gatilhos abaixo: 35% da altura do bloco dentro da área
  // visível do #main. Percentual do BLOCO, não da tela — senão bloco alto nunca marcaria.
  function checa(){
    if(!alvos.size) return;
    const cx = main.getBoundingClientRect();
    alvos.forEach(function(m, el){
      const r = el.getBoundingClientRect();
      const visivel = Math.min(r.bottom, cx.bottom) - Math.max(r.top, cx.top);
      if(r.height > 0 && visivel / r.height >= 0.35){
        alvos.delete(el);
        try{ trackStep(m); }catch(_){}
      }
    });
  }

  // ⚠️ DOIS gatilhos de propósito. O IntersectionObserver é o eficiente, mas NÃO ENTREGA
  // com o documento escondido (medido aqui: aba em segundo plano, zero callback) e os
  // navegadores in-app do Face costumam ser piores. O listener de rolagem no #main é o
  // que garante a medida — e vai no #main porque scroll de elemento NÃO sobe pro document,
  // nem em fase de captura (isso já mordeu uma vez no back redirect).
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver(function(){ checa(); if(!alvos.size) io.disconnect(); },
                                        { root: main || null, threshold: [0, .2, .35, .6] });
    alvos.forEach(function(_m, el){ io.observe(el); });
  }
  let preso = false;
  main.addEventListener('scroll', function(){
    if(preso) return; preso = true;
    setTimeout(function(){ preso = false; checa(); }, 200);   // no máximo 5 medidas por segundo
  }, { passive: true });
  checa();   // já chega vendo o preço? (tela alta, ou ela volta do checkout)
}

function urgencyBar(fixa){
  // o relógio só arranca quando a barra ENTRA NA TELA (com a VSL acima, a oferta demora a aparecer)
  // — startUrgencyWhenVisible() abaixo define _offerDeadline no 1o momento em que a barra fica visível.
  return `<div class="urgency${fixa?' fixa':''}"><span class="u-ico">⏰</span> Preço de ${TK.mes} garantido só por <b class="u-time">07:00</b></div>`;
}
const OVER_MSG = '<span class="u-ico">\u26a0\ufe0f</span> Ao sair desta p\u00e1gina, esta promo\u00e7\u00e3o ser\u00e1 encerrada.';
setInterval(()=>{   // atualiza todos os relógios na tela (deadline persiste entre telas)
  if(!_offerDeadline) return;
  let ms = Math.max(0, _offerDeadline - Date.now());
  if(ms<=0){        // zerou: troca a barra pelo aviso (inclusive barras renderizadas depois)
    document.querySelectorAll('.urgency').forEach(b=>{
      if(b.classList.contains('over')) return;
      b.classList.add('over'); b.innerHTML = OVER_MSG;
    });
    return;
  }
  const els = document.querySelectorAll('.u-time'); if(!els.length) return;

/* O "agora" da conexão vem da resposta DELA (faithLevelScreen) — personalização no molde dos
   grandes: o estado atual é o que ela disse, não um chute. Até quem marcou "relação forte"
   vê barra 3/4: o que falta é a ROTINA, que é o que o app vende. */
function adConexaoAtual(){
  const r = String((answers && answers.faithLevelScreen) || '');
  if(/forte/i.test(r))     return { n:3, txt:'Forte, sem rotina' };
  if(/crescendo/i.test(r)) return { n:2, txt:'Crescendo' };
  if(/começando/i.test(r)) return { n:1, txt:'Começando agora' };
  if(r)                    return { n:1, txt:'Distante' };
  return { n:1, txt:'Começando' };
}

function wireTrials(){
  // aplica um plano em TODOS os blocos do paywall (topo e rodapé): marca a linha,
  // atualiza o texto do botão + a legenda, e pré-carrega o checkout desse plano.
  const applyPlan = (plan, cta, note)=>{
    main.querySelectorAll('.trial .plan-row').forEach(r=>{
      const on = r.dataset.plan===plan;
      r.classList.toggle('sel', on);
      const rad=r.querySelector('.radio'); if(rad) rad.textContent = on ? '✓' : '';
    });
    if(cta) main.querySelectorAll('.pw-cta').forEach(b=> b.textContent = cta);
    if(note){
      // era textContent e apagava o destaque verde no primeiro toque num plano.
      // Escapa primeiro (a nota vem de um data-attribute) e só depois pinta o valor.
      const esc = note.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const html = esc.replace(/(R\$&nbsp;|R\$ )(\d{1,3}(?:\.\d{3})*,\d{2})/g,
                               (m,a,b)=>`<b class="pr-verde">${a}${b}</b>`);
      main.querySelectorAll('.pw-price').forEach(p=> p.innerHTML = html);
    }

  /* ⚠️ Sincroniza a legenda com o plano JÁ pré-selecionado. Enquanto o mensal era o padrão
     isto não fazia falta — o HTML nascia com a nota dele. Com o ANUAL pré-selecionado (04/09)
     e sem clique nenhum, a tela ficava com o anual marcado e a legenda dizendo "depois
     R$ 59,90/mês": preço na tela diferente do plano que vai ser cobrado, que é o jeito mais
     rápido de perder a venda (e de gerar reembolso). */
  try{
    const _pre = main.querySelector('.trial .plan-row.sel');
    if(_pre) applyPlan(_pre.dataset.plan, _pre.dataset.cta, _pre.dataset.note);
  }catch(_){}
  main.querySelectorAll('.switch').forEach(sw=> sw.onclick=()=> sw.classList.toggle('on'));
  main.querySelectorAll('.pw-cta').forEach(b=> b.onclick=()=>{
    const sel = main.querySelector('.trial .plan-row.sel');
    if(!sel) return;
    answers._priceId = sel.dataset.priceId;
    answers._planCode = sel.dataset.plan;
    answers._planLabel = sel.querySelector('b').textContent.trim();
    // 73 = APERTOU O BOTÃO DE COMPRAR. Marca ANTES do if da Hotmart de propósito: é o
    // único ponto por onde os dois checkouts passam, e portanto o único denominador que
    // permite comparar um com o outro. Depois dele os caminhos se separam:
    //   Stripe  -> 28 (tela de cartão) -> 31 (completo)

    try{ trackStep(73); }catch(_){}

       então até 04/09 ninguém sabia quantas mães ESCOLHEM o anual e não fecham (só dava pra
       ver a venda final: 2 anuais em 54). Sem este marco, decidir preço/duração é no escuro.
       Mensal = 73 - 79. Cai sozinho no bloco `vivo` do BI, que soma todas as chaves do dia. */
    try{ if(answers._planCode === 'year') trackStep(79); }catch(_){}
    /* HOTMART: sai do funil e vai pro checkout deles. Só entra aqui com a flag
       LIGADA e link preenchido — sem link, segue na Stripe (nunca manda ninguém
       pra lugar nenhum). O e-mail vai junto pra pré-preencher e, principalmente,
       pra garantir que a compra nasça com o MESMO e-mail que o app usa depois. */
    if(window.vaiPraHotmart && window.vaiPraHotmart()){
      var _anual = (answers._planCode === 'year');
      /* SEM fallback cruzado. Antes o anual sem link proprio caia no `|| PAY_URL` e ia
         pro checkout MENSAL: a mae escolhia R$ 299/ano e pagava R$ 59,90/mes, sem erro
         nenhum aparecer. Agora, oferta sem link = segue na Stripe, que e o pior caso
         aceitavel (a venda acontece do jeito antigo) em vez de cobrar o plano errado. */
      var _ofertas = window.HOTMART_OFERTAS || {};
      var _u = _anual ? (_ofertas.anual  || window.HOTMART_PAY_URL_YEAR || '')
                      : (_ofertas.mensal || window.HOTMART_PAY_URL      || '');
      /* TESTE DE TICKET (29/08): o braco A do sorteio ve R$ 49,90 no paywall, e a oferta
         da Hotmart cobra 59,90 — mandar o braco A pra la e prometer um preco e cobrar
         outro. Sem link proprio do 49,90 (mensal49), o braco A SEGUE NA STRIPE, que tem
         o price do teste e honra o valor. Custo: com a flag ligada, o teste fica com um
         braco em cada gateway — estatistica contaminada. A saida limpa e criar a oferta

      if(!_anual && window._acjTicket === 'A'){ _u = _ofertas.mensal49 || ''; }

      if(window._acjOferta){

                                                    : (_ofertas.back1 || '');

        /* braco A (49,90) com oferta aceita: SEMPRE Stripe. As ofertas de back da Hotmart
           recorrem a 59,90 — quem viu 49,90 pagaria mais da 2a mensalidade em diante. Na

        else if(window._acjTicket === 'A'){ _u = ''; }

        /* ⚠️ LEAD ANTES DE SAIR. A captura de lead mora na TELA DE CHECKOUT, que o redirect

           que o adctx (contexto de anúncio do CAPI) só nasce em /api/lead. Sem ele o
           StartTrial/Purchase chega no Facebook sem saber de que criativo veio, e o
           algoritmo passa a otimizar no escuro. keepalive aguenta o redirect. */
        try{
          var _emLead = (answers && answers.freeTrialScreen) || '';
          if(_emLead && _emLead.indexOf('@')>0) captureLead(_emLead, '', (answers && answers._phone) || '');
        }catch(_){}

          var _em = (answers && answers.freeTrialScreen) || '';
          if(_em) _q.push('email=' + encodeURIComponent(_em));
          /* RASTREIO DE ANÚNCIO. A Hotmart não carrega UTM, mas aceita src/sck e os
             devolve no webhook. Honra o formato cru (?src=/?sck= na entrada) E as UTMs —
             utm_content em src porque é a 1ª escolha do BI na atribuição. */
          try{
            var _utm = (typeof utmData === 'function') ? (utmData() || {}) : {};
            var _limpa = function(v){ return String(v || '').replace(/[^\w.\-:|]+/g, '').slice(0, 120); };
            var _src = _limpa(_utm.src || _utm.utm_content || _utm.utm_campaign || _utm.utm_source);
            /* ⚠️ O `sck` deixa de ser a campanha e passa a ser a CHAVE DA SESSÃO.
               Motivo: o campo de e-mail saiu do quiz em 24/08 e virou campo do checkout —
               que hoje é da Hotmart. Ou seja, a mãe sai do site e a gente NUNCA soube o
               e-mail dela. Toda a atribuição que eu tinha montado (braço do teste, anúncio,
               funil) era por e-mail e portanto nunca engatava: as vendas entravam sem
               campanha nenhuma. O `sck` é campo livre, a Hotmart devolve ele no webhook, e
               com o sid a gente reencontra a sessão inteira no KV (ver marco 74 no track).
               O anúncio continua indo no `src`, que é o que o painel da Hotmart mostra. */
            var _sck = _limpa(window._acjSid || _utm.sck || _utm.utm_campaign);
            if(_src) _q.push('src=' + encodeURIComponent(_src));
            if(_sck) _q.push('sck=' + encodeURIComponent(_sck));
          }catch(_){ }
          if(_q.length) _u += (_u.indexOf('?') < 0 ? '?' : '&') + _q.join('&');
          /* FOTOGRAFA a sessão antes de sair: o funil nasce SEMPRE na etapa 0 (`let i = 0`,
             nada persiste), e no celular voltar da Hotmart RECARREGA a página — sem isto, a
             mãe que foi só espiar o checkout voltava pra PRIMEIRA PERGUNTA DO QUIZ. Ela não
             refaz trinta telas; ela fecha. O boot restaura direto no paywall (ver acj_volta). */
          try{ sessionStorage.setItem('acj_volta', JSON.stringify({ a: answers, ts: Date.now() })); }catch(_){}
          /* marca a saída antes de redirecionar — compara depois quantos foram pro
             checkout da Hotmart contra quantas vendas saíram de lá. */
          try{
            /* QA nao conta: este beacon vai DIRETO pro app-event (nao passa pelo trackStep,
               que e quem respeita __acjQA) — no 1o dia da virada os testes do dono inflaram
               o checkout_hotmart e o denominador da conversao ficou mentiroso. */
            if(window.__acjQA) throw 0;
            var _ev = JSON.stringify({ event:'checkout_hotmart', tag:'plano', val: answers._planCode || '', ts: Date.now() });
            if(navigator.sendBeacon) navigator.sendBeacon('/api/app-event', _ev);
            else fetch('/api/app-event', { method:'POST', headers:{'Content-Type':'text/plain'}, body:_ev, keepalive:true }).catch(function(){});
          }catch(_){ }
          location.href = _u;
        };

        /* E-MAIL ANTES DO REDIRECT. O e-mail mora na tela de checkout (mudança de 26/08),
           que este redirect PULA — sem esta parada, quem clica em comprar sai do site sem
           deixar e-mail: checkout da Hotmart vazio, ZERO captura de lead (quem abandona lá
           some sem régua de recuperação) e o CAPI sem contexto de anúncio (adctx é por
           e-mail). Uma tela só, mesmo texto do checkout, e o redirect sai daqui. */
        if(answers && answers.freeTrialScreen){ _vaiPraHotmart(); return; }

           e-mail velho no campo e o veu cobrindo qualquer modal de saida que dispare
           por baixo. pageshow remove a tela no retorno: quem voltou e clicar de novo
           nem passa por aqui (o e-mail ja esta em answers) e vai direto pro checkout. */
        if(!window.__hotGateLimpo){

          + '<button id="hot-email-go" class="btn" style="width:100%;margin-top:12px">Continuar para o pagamento →</button>'
          + '</div>';
        document.body.appendChild(_hv);
        var _hIn = _hv.querySelector('#hot-email');
        _hIn.focus();
        var _hGo = function(){
          var v = String(_hIn.value || '').trim().toLowerCase();
          var ok = !!v && v.indexOf('@') > 0 && /\.[a-z]{2,}$/i.test(v);
          if(!ok){ _hv.querySelector('#hot-email-err').style.display = 'block'; _hIn.focus(); return; }

        };
        _hv.querySelector('#hot-email-go').onclick = _hGo;
        _hIn.addEventListener('keydown', function(e){ if(e.key === 'Enter') _hGo(); });

      }
    }

    // UTMify, nem CAPI (precisa do hash), nem e-mail de boas-vindas. So pre-cria se ja houver.
    if(typeof prefetchSubscription==='function' && answers && answers.freeTrialScreen)
      prefetchSubscription(answers._priceId);
    const ci = STEPS.findIndex(s=>s.key==='checkoutScreen');
    if(ci>=0) go(ci);
  });

    const sync = ()=>{ const v=inp.value.trim().toLowerCase(); answers[s.key]=v; const ok=valid(v); b.disabled=!ok; b.classList.toggle('pulse', ok); };
    const DOMS=['gmail.com','hotmail.com','outlook.com','yahoo.com.br','icloud.com','live.com','hotmail.com.br','bol.com.br','uol.com.br','terra.com.br'];
    const renderSug = ()=>{
      const v=inp.value.trim().toLowerCase(); const at=v.indexOf('@'); sug.innerHTML='';

      if(DOMS.indexOf(dp)>=0) return;                  // já digitou um domínio conhecido inteiro

        sug.appendChild(chip);

    if(typeof prewarmPaddle === 'function') prewarmPaddle();   // pré-carrega Paddle no idle
    main.insertAdjacentHTML('beforeend', buildCarousel());

    // ===== VSL: headline + vídeo logo abaixo do carrossel (o preço desce pra depois) =====

    main.insertAdjacentHTML('beforeend', `<div id="pwafter" class="pwafter${_vslB ? ' pw-hide' : ''}"></div>`);

    /* SEM VÍDEO, A OFERTA VEM PRIMEIRO. Manter o preço enterrado numa página sem vídeo

    if(_semVideo){

      af.insertAdjacentHTML('beforeend', antesDepoisBlock());

      af.insertAdjacentHTML('beforeend', trialBlock(s).replace('class="trial"', 'class="trial trial-topo"'));

    if(!_semVideo) af.insertAdjacentHTML('beforeend', antesDepoisBlock());
    // Se a arte ainda não subiu (ou 404), o bloco SOME em vez de mostrar quadro quebrado.
    // ⚠️ SEM loading="lazy" nestas duas de propósito: com lazy o navegador nem tenta carregar
    // enquanto ela não chega perto, o erro nunca dispara, e o quadro quebrado apareceria
    // justo na hora em que ela rolasse até ali. fetchpriority=low pra não brigar com a VSL.
    // A seta mora no meio da FOTO. A foto é quadrada, então a altura dela muda com a largura
    // da tela — e top:% em CSS mede a ALTURA do pai, não a largura. Mede depois de montar e

    (function(){

        const mostra = () => w.classList.add('ad-vis');
        try{
          const io = new IntersectionObserver(function(en){
            en.forEach(function(e){ if(e.isIntersecting){ mostra(); io.disconnect(); } });
          }, { threshold: 0.25 });

    (function(){

   Padrão: /baixar (APK). Com PWA_HANDOFF ligado: manda pro app web já carregando a
   prova de pagamento (?si= no trial, ?sub= sem trial) — a pessoa entra SEM digitar
   nada, aproveitando o único momento de atenção que ela dá.
   É uma CHAVE: desligar volta tudo pro /baixar na hora, sem mexer em código. */
function destinoPosCompra(){
  try{
    if(!window.PWA_HANDOFF) return '/baixar';
    var si = window._ckSi || '', sub = window._ckSub || '';
    // barra final OBRIGATÓRIA: sem ela o browser resolve app.css/app.js a partir da raiz (404)
    if(si)  return '/app/?si=' + encodeURIComponent(si);
    if(sub) return '/app/?sub=' + encodeURIComponent(sub);
  }catch(_){}
  return '/baixar';   // sem prova de pagamento: caminho de sempre
}

/* ===== feedback de toque: "pop" suave e quente (Web Audio, sem asset) + vibração discreta ===== */
let _actx;
function clickTick(soft){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    const t=_actx.currentTime;
    const o=_actx.createOscillator(), g=_actx.createGain(), lp=_actx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=1100; lp.Q.value=0.3;   // tira o "bico" agudo
    const f0 = soft ? 300 : 360;                                  // grave e aconchegante
    o.type='sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*0.7,t+0.09);      // leve queda = "pop"
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(soft?0.05:0.075,t+0.012);      // ataque macio, volume baixo
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);           // release suave
    o.connect(lp); lp.connect(g); g.connect(_actx.destination);
    o.start(t); o.stop(t+0.18);
  }catch(e){}
}

      if(!answers.ageSelectionScreenV2) answers.ageSelectionScreenV2 = '4 a 6 anos';
      if(key === 'checkoutScreen'){ answers._planCode='trial'; answers._priceId=TK.priceId; }
      const idx = STEPS.findIndex(x => x.key === key);
      if(idx >= 0){ go(idx); return true; }
    }catch(e){}
  })() || voltaDoCheckout() || go(0);

  /* VOLTA DO CHECKOUT DA HOTMART. O redirect fotografa a sessão (acj_volta) antes de sair;
     se a pessoa voltar, restaura as respostas e cai DIRETO NO PAYWALL em vez da primeira
     pergunta do quiz. Só age numa volta de verdade (referrer da Hotmart ou navegação de
     voltar/recarga) e dentro de 2h — link novo de anúncio dias depois começa do zero.
     Bônus: no paywall a escada de back rearma na etapa salva (sessionStorage), então quem
     desistiu do checkout pode receber o modal de resgate — o gatilho que faltava. */
  function voltaDoCheckout(){
    try{
      const cru = sessionStorage.getItem('acj_volta'); if(!cru) return false;
      const foto = JSON.parse(cru); if(!foto || !foto.a) return false;
      if(Date.now() - (foto.ts || 0) > 2 * 3600 * 1000){ sessionStorage.removeItem('acj_volta'); return false; }
      let voltou = /hotmart/i.test(document.referrer || '');
      try{
        const nav = performance.getEntriesByType('navigation')[0];
        if(nav && (nav.type === 'back_forward' || nav.type === 'reload')) voltou = true;
      }catch(_){}
      if(!voltou) return false;
      Object.assign(answers, foto.a);
      const idx = STEPS.findIndex(x => x.key === 'paywallScreen');
      if(idx >= 0){ go(idx); return true; }
    }catch(_){}
    return false;
  }
})();

    el.on('change', (ev)=>{

  // ANUAL não dispara nada aqui. A UTMify já reporta Purchase = dinheiro real (dia 8 no trial / dia 0 no anual), server-side.
  // NÃO disparamos Purchase no browser p/ não DOBRAR com o da UTMify.
  try{ if(typeof window.fbq==='function'){ window.__fbFired=window.__fbFired||{}; const _pl=(typeof answers!=='undefined'&&answers._planCode)||'trial'; if(!window.__fbFired.trial){ window.__fbFired.trial=true; window.fbq('track','StartTrial',{value:(_pl==='year'?299:(TK.cents/100)),currency:'BRL'},{eventID:(window._ckEvtId||undefined)}); } } }catch(_){}
  // NewsBreak: cartao confirmado = conversao (vale p/ trial E anual)
  try{ if(typeof window.nbpix==='function'){ window.__nbFired=window.__nbFired||{}; if(!window.__nbFired.conv){ window.__nbFired.conv=true; const _p3=(typeof answers!=='undefined'&&answers._planCode)||'trial'; window.nbpix('event','complete_payment',{nb_value:_p3==='year'?299:(TK.cents/100)}); } } }catch(_){}
  const ci = STEPS.findIndex(s=>s.key==='completeScreen');
  if(ci>=0) go(ci);
}
</script>
